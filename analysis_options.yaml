# Rules for the Dart static analyzer.
#
# The analyzer underlines code in yellow or red as you type, and it is what
# `flutter analyze` runs. This file decides WHAT counts as an error in this
# project, so it is the single most important file for code quality.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Generated files are not checked, because you never write them by hand.
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - 'build/**'
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  errors:
    # A TODO does not break the build, but it stays visible.
    todo: info
    # Real bugs that Dart only reports as warnings. Promote them to errors.
    missing_required_param: error
    missing_return: error
    # An unused import is dead code. Fail the analysis.
    unused_import: error
    unused_local_variable: error
    # Code generators legitimately annotate private fields. Silence the noise.
    invalid_annotation_target: ignore

  language:
    # Forbid implicit casts from `dynamic`. A wrong type fails at compile time
    # instead of crashing the app at runtime.
    strict-casts: true
    # Forbid `List` without a type argument. `List<Exercise>`, never `List`.
    strict-raw-types: true

linter:
  rules:
    # --- Correctness: these prevent real bugs ---
    always_declare_return_types: true
    avoid_empty_else: true
    # `print` is stripped in release builds and you see nothing. Use debugPrint.
    avoid_print: true
    # A stream you never cancel keeps running forever. Classic memory leak.
    cancel_subscriptions: true
    # Same idea for sinks, and for the Cubits you will write.
    close_sinks: true
    # A forgotten `await` fails silently: the code moves on before the work is
    # done, and the error never reaches you.
    unawaited_futures: true
    # Flutter's #1 bug: using `context` after an `await`, when the screen may
    # already be gone. Always check `mounted` first.
    use_build_context_synchronously: true

    # --- Performance ---
    # A `const` widget is built once and Flutter reuses it forever instead of
    # rebuilding it. The cheapest optimization that exists in Flutter.
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    avoid_unnecessary_containers: true
    # An empty Container allocates a full render box. SizedBox does not.
    sized_box_for_whitespace: true
    use_colored_box: true
    use_decorated_box: true

    # --- Style and readability ---
    # THE key rule: a trailing comma is what makes Dart format widgets
    # vertically instead of on one 300-character line.
    require_trailing_commas: true
    prefer_single_quotes: true
    # Import order: dart -> package -> relative.
    directives_ordering: true
    # The `child` parameter always goes last, so the tree reads top to bottom.
    sort_child_properties_last: true
    curly_braces_in_flow_control_structures: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    unnecessary_this: true
    unnecessary_late: true

    # --- Naming ---
    camel_case_types: true
    non_constant_identifier_names: true
    # Too noisy with Flutter's own `State<T>` classes.
    library_private_types_in_public_api: false

    # --- Documentation ---
    # Doc comments are required by review, not by the analyzer. Forcing one on
    # every getter produces noise, not documentation.
    public_member_api_docs: false
    slash_for_doc_comments: true
